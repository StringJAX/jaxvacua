name: CI

# See workflows/stringjax/jaxvacua_ci.md for rationale behind this split.
#
#  * fast — runs on every push/PR. pytest -m "not slow".
#    All deps installed (cytools is required at import time); targets
#    a few minutes of GHA wall time.  Includes tests/test_coniLCS_limit.py
#    (the NB13-fingerprint coniLCS regression net) — those tests have no
#    `slow` marker and are picked up by `pytest -m "not slow"`.
#  * test-full — full-coverage suite, split by path first and by pytest-split
#    only inside genuinely heavy files.  This avoids repeatedly importing the
#    whole test tree in every shard, which is expensive for coniLCS/freezer
#    fixtures.
#
# jaxpolylog version exclusion
# ----------------------------
# The conifold dilog uses jax_polylog_vmap(..., approx="patch") for
# limit="coniLCS". jaxpolylog 0.2.0 changed the "patch" output enough to
# break the coniLCS convergence basin; all earlier and later versions are
# fine.  Pin via "!=0.2.0" rather than an upper bound — a fixed 0.2.x is
# expected upstream soon. Drop the exclusion once test_coniLCS_limit.py
# passes against the new release.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 0"   # Sunday 04:00 UTC (weekly)
  workflow_dispatch:

# Single source of truth for the jaxpolylog spec.
env:
  JAXPOLYLOG_PIN: "jaxpolylog>=0.1.0,!=0.2.0"

# Cancel any in-flight runs on the same ref when a new commit lands.
# Without this, every push spawns many jobs (fast + docs + full test matrix)
# on top of the previous push's still-running ones,
# quickly overflowing GitHub's ~20-concurrent-Ubuntu-job free-tier cap.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast (pytest -m 'not slow')
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cache JAX compilation cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/jax
          key: ${{ runner.os }}-py${{ matrix.python-version }}-jaxcache-fast-${{ hashFiles('jaxvacua/**/*.py', 'tests/**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-jaxcache-fast-

      - name: Install jaxvacua + deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest chex "${{ env.JAXPOLYLOG_PIN }}"
          # platformdirs is a transitive dep of cytools not declared by the
          # cytools PyPI wheel; install explicitly to avoid ModuleNotFoundError.
          pip install platformdirs
          # cytools is required at jaxvacua import time (see
          # jaxvacua/__init__.py — eager `from .cytools_interface import *`).
          pip install -e .

      - name: Run fast test suite
        env:
          JAX_ENABLE_X64: "1"
        run: pytest tests/ -v -m "not slow"

  docs-smoke:
    name: Docs smoke (sphinx-build)
    # Catches broken toctree entries, dangling cross-refs, stale notebook
    # paths after the 2026-05 tutorial refactor. Does NOT execute notebooks
    # (too slow on GHA — execution is a separate concern).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r documentation/requirements.txt
          pip install "${{ env.JAXPOLYLOG_PIN }}"
          pip install platformdirs
          pip install -e .

      - name: Build HTML (warnings allowed)
        run: |
          sphinx-build -b html -E -q -j 1 --keep-going \
            -d /tmp/sphinx-doctree \
            documentation/source /tmp/sphinx-out

  test-full:
    name: Full (${{ matrix.suite }}, py${{ matrix.python-version }})
    # Full-coverage suite split by file/group first, and only then by
    # pytest-split inside genuinely heavy files.  This avoids the old
    # `pytest tests/ --splits=N` topology, where every shard collected and
    # imported every test module, repeatedly paying import-time coniLCS/freezer
    # setup costs.
    # Runs on every push/PR + weekly cron + manual dispatch.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: light-core
            python-version: "3.13"
            paths: "tests/test_flux_utils.py tests/test_flux_utils_helpers.py tests/test_hypergeometric_models.py tests/test_lattice_utils.py tests/test_lcs.py tests/test_pytree_stability.py tests/test_sampling.py tests/test_sampling_backend_helpers.py tests/test_util_core.py"
            split_args: ""
          - suite: geometry-medium
            python-version: "3.13"
            paths: "tests/test_conifold_bulk_eft.py tests/test_css.py tests/test_periods.py"
            split_args: ""
          - suite: coniLCS
            python-version: "3.13"
            paths: "tests/test_coniLCS_limit.py"
            split_args: ""
          - suite: conifold-basis
            python-version: "3.13"
            paths: "tests/test_conifold_basis.py"
            split_args: ""
          - suite: freezer
            python-version: "3.13"
            paths: "tests/test_freezer.py"
            split_args: ""
          - suite: flux-eft-1
            python-version: "3.13"
            paths: "tests/test_flux_eft.py"
            split_args: "--splits=6 --group=1 --splitting-algorithm=least_duration --durations-path .test_durations"
          - suite: flux-eft-2
            python-version: "3.13"
            paths: "tests/test_flux_eft.py"
            split_args: "--splits=6 --group=2 --splitting-algorithm=least_duration --durations-path .test_durations"
          - suite: flux-eft-3
            python-version: "3.13"
            paths: "tests/test_flux_eft.py"
            split_args: "--splits=6 --group=3 --splitting-algorithm=least_duration --durations-path .test_durations"
          - suite: flux-eft-4
            python-version: "3.13"
            paths: "tests/test_flux_eft.py"
            split_args: "--splits=6 --group=4 --splitting-algorithm=least_duration --durations-path .test_durations"
          - suite: flux-eft-5
            python-version: "3.13"
            paths: "tests/test_flux_eft.py"
            split_args: "--splits=6 --group=5 --splitting-algorithm=least_duration --durations-path .test_durations"
          - suite: flux-eft-6
            python-version: "3.13"
            paths: "tests/test_flux_eft.py"
            split_args: "--splits=6 --group=6 --splitting-algorithm=least_duration --durations-path .test_durations"
          - suite: flux-vacua-finder-1
            python-version: "3.13"
            paths: "tests/test_flux_vacua_finder.py"
            split_args: "--splits=2 --group=1 --splitting-algorithm=least_duration --durations-path .test_durations"
          - suite: flux-vacua-finder-2
            python-version: "3.13"
            paths: "tests/test_flux_vacua_finder.py"
            split_args: "--splits=2 --group=2 --splitting-algorithm=least_duration --durations-path .test_durations"
          - suite: critical-points-1
            python-version: "3.13"
            paths: "tests/test_critical_points.py"
            split_args: "--splits=2 --group=1 --splitting-algorithm=least_duration --durations-path .test_durations"
          - suite: critical-points-2
            python-version: "3.13"
            paths: "tests/test_critical_points.py"
            split_args: "--splits=2 --group=2 --splitting-algorithm=least_duration --durations-path .test_durations"
          - suite: flux-bounding-1
            python-version: "3.13"
            paths: "tests/test_flux_bounding.py"
            split_args: "--splits=2 --group=1 --splitting-algorithm=least_duration --durations-path .test_durations"
          - suite: flux-bounding-2
            python-version: "3.13"
            paths: "tests/test_flux_bounding.py"
            split_args: "--splits=2 --group=2 --splitting-algorithm=least_duration --durations-path .test_durations"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cache JAX compilation cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/jax
          key: ${{ runner.os }}-py${{ matrix.python-version }}-jaxcache-full-${{ matrix.suite }}-${{ hashFiles('jaxvacua/**/*.py', 'tests/**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-jaxcache-full-${{ matrix.suite }}-

      - name: Install jaxvacua + deps + pytest-split
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-split chex "${{ env.JAXPOLYLOG_PIN }}"
          pip install platformdirs
          pip install -e .

      - name: Run ${{ matrix.suite }}
        env:
          JAX_ENABLE_X64: "1"
        run: pytest ${{ matrix.paths }} -v ${{ matrix.split_args }}
